name: nightly regression

# Every pool model type x every board on the current SAI release: RAM/flash/plan-fit drift and emulated HIL
# bit-exactness (QEMU Cortex-M7 + RV32IMAFC). Fails (and keeps the report) on any alert.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_SAI_TOKEN: ${{ secrets.SAI_REPO_TOKEN != '' }}
    steps:
      - name: SAI token missing
        if: env.HAS_SAI_TOKEN != 'true'
        run: echo "::notice::SAI_REPO_TOKEN is not set; nightly regression skipped."
      - uses: actions/checkout@v4
        if: env.HAS_SAI_TOKEN == 'true'
      - uses: actions/checkout@v4
        if: env.HAS_SAI_TOKEN == 'true'
        with:
          repository: anhtt251085/mcu_edge_ai
          token: ${{ secrets.SAI_REPO_TOKEN }}
          path: sai-src
      - uses: actions/setup-python@v5
        if: env.HAS_SAI_TOKEN == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Toolchains and QEMU
        if: env.HAS_SAI_TOKEN == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm qemu-system-misc
          curl -fsSL -o /tmp/xp.tgz https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          echo "52545afb900200fbf65fe05f7ce7090b8a42c64091f4f5d43cae6bb68ea2434a  /tmp/xp.tgz" | sha256sum -c -
          sudo mkdir -p /opt/xpack && sudo tar -xzf /tmp/xp.tgz -C /opt/xpack
      - name: Install
        if: env.HAS_SAI_TOKEN == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ./sai-src
      - name: Restore previous results
        if: env.HAS_SAI_TOKEN == 'true'
        uses: actions/cache/restore@v4
        with:
          path: var-nightly
          key: nightly-${{ github.run_id }}
          restore-keys: nightly-
      - name: Regression
        if: env.HAS_SAI_TOKEN == 'true'
        run: |
          export SAI_MD6605_GCC=/opt/xpack/xpack-riscv-none-elf-gcc-13.2.0-2/bin/riscv-none-elf-gcc
          export SAI_PLATFORM_DATA="$PWD/var-nightly"
          python -m backend.regression
      - name: Save results for the next comparison
        if: always() && env.HAS_SAI_TOKEN == 'true'
        uses: actions/cache/save@v4
        with:
          path: var-nightly
          key: nightly-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_SAI_TOKEN == 'true'
        with:
          name: regression-report
          path: var-nightly/regression/latest.json
