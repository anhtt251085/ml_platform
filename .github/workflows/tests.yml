name: tests

# Public CI. It never checks out, installs or downloads the private SAI compiler: SAI-dependent tests skip here
# and run on a machine with the SAI checkout (tools/full_check.sh).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (no SAI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests (SAI-dependent tests skip)
        env:
          SAI_BIN: /nonexistent/sai
        run: |
          export SAI_PLATFORM_DATA="$RUNNER_TEMP/saiplat"
          python -m pytest -q tests -rs

  docker:
    name: docker image (no SAI inside)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build image and check it starts
        run: |
          docker build --build-arg SAI_PLATFORM_VERSION=${{ github.sha }} --build-arg SAI_PLUGINS=0 -t sai-platform:ci .
          docker run -d --name plat -e SAI_PLATFORM_ADMIN_PASSWORD=ci-pass-1234 -p 8000:8000 sai-platform:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
          docker exec plat sh -c 'test ! -e /opt/sai && ! python -c "import sai" 2>/dev/null' && echo "image has no SAI code"
          docker rm -f plat

  toolchains:
    name: MCU toolchains + QEMU (SAI tests skip)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Arm toolchain and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm qemu-system-misc
      - name: Cache xPack RISC-V toolchain
        id: xpack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: /opt/xpack
          key: xpack-riscv-none-elf-gcc-13.2.0-2
      - name: Install xPack RISC-V toolchain (pinned, checksummed)
        if: steps.xpack.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xp.tgz https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz
          echo "52545afb900200fbf65fe05f7ce7090b8a42c64091f4f5d43cae6bb68ea2434a  /tmp/xp.tgz" | sha256sum -c -
          sudo mkdir -p /opt/xpack && sudo tar -xzf /tmp/xp.tgz -C /opt/xpack
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: |
          export SAI_MD6605_GCC=/opt/xpack/xpack-riscv-none-elf-gcc-13.2.0-2/bin/riscv-none-elf-gcc
          export SAI_PLATFORM_DATA="$RUNNER_TEMP/saiplat"
          python -m pytest -q tests -rs
