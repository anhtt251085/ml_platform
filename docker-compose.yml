# docker compose up -d --build   (SAI_REPO = your SAI compiler checkout, default ../mcu_edge_ai; it is mounted
# read-only and the compiler runs in place from it - nothing from it is copied into the image)
# SaaS:     SAI_PLATFORM_MODE=multi  (default) - SAI admins create customer organisations
# On-prem:  SAI_PLATFORM_MODE=single SAI_PLATFORM_ORG_NAME="Acme" - one customer per install
x-common: &common
  image: sai-platform:latest
  environment: &env
    SAI_PLATFORM_MODE: ${SAI_PLATFORM_MODE:-multi}
    SAI_PLATFORM_ORG_NAME: ${SAI_PLATFORM_ORG_NAME:-Customer}
    SAI_PLATFORM_ADMIN_EMAIL: ${SAI_PLATFORM_ADMIN_EMAIL:-admin@sai.local}
    SAI_PLATFORM_ADMIN_PASSWORD: ${SAI_PLATFORM_ADMIN_PASSWORD:?set an admin password}
    SAI_PLATFORM_SIM_BOARDS: ${SAI_PLATFORM_SIM_BOARDS:-1}
    SAI_PLATFORM_COOKIE_SECURE: ${SAI_PLATFORM_COOKIE_SECURE:-auto}    # Secure whenever served over HTTPS
    SAI_REPO: /opt/sai
  volumes:
    - platform-data:/data
    - ${SAI_REPO:-../mcu_edge_ai}:/opt/sai:ro
  restart: unless-stopped

services:
  api:
    <<: *common
    build:
      context: .
    environment:
      <<: *env
      SAI_PLATFORM_INPROC_WORKERS: "0"          # jobs run in the worker service
    ports:
      - "${PORT:-8000}:8000"

  worker:
    <<: *common
    command: ["python", "-m", "backend.worker", "--threads", "${WORKER_THREADS:-2}"]
    environment:
      <<: *env
      SAI_PLATFORM_SIM_BOARDS: "0"               # the simulated lab agent lives in the API process
    depends_on:
      - api

volumes:
  platform-data:
